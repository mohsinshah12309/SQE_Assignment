[pytest]
pythonpath = .
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers for test grouping and suites (Task 4)
markers =
    smoke: Smoke test suite for critical basic path validations
    regression: Comprehensive regression test suite
    module1_auth: Tests covering Module 1 (Authentication & User Management)
    module2_trans: Tests covering Module 2 (Transaction & Fee Engine)
    module3_inv: Tests covering Module 3 (Inventory & Discount Service)
    data_driven: Tests consuming external CSV test data (Task 3 & 4)
